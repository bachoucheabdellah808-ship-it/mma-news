<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | truncate: 155 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} feed" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-head">
    <a class="brand" href="{{ '/' | relative_url }}">🥊 <strong>{{ site.title }}</strong></a>
    <nav>
      <a href="{{ '/' | relative_url }}">Latest</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-foot">
    <p>{{ site.title }} — auto-curated MMA headlines · updated automatically by an n8n workflow.
    <span class="muted">Build: {{ 'now' | date: '%Y-%m-%d %H:%M' }} UTC</span></p>
  </footer>
